name: tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.2.6 opencv-python-headless==5.0.0.93 \
            imageio-ffmpeg==0.6.0 streamlit==1.65.0 "pytest>=8.0,<10"
      - name: Run unit/integration tests
        run: python -m pytest -q tests

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install ruff
      - run: ruff check --select E9,F src app.py modal_app.py tests scripts
